<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portail fournisseurs</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#f4f6fb;color:#1f2937;margin:0}
    header{background:#9a3412;color:#fff;padding:14px 20px;font-weight:600}
    main{max-width:720px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px}
    button{background:#9a3412;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin-right:8px}
    .muted{color:#6b7280;font-size:.9em}
    #admin{display:none}
    pre{background:#0b1020;color:#edf2fc;padding:12px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <header>Portail fournisseurs — espace partenaire</header>
  <main>
    <div class="card">
      <h2>Mes factures</h2>
      <p id="status" class="muted">Chargement…</p>
      <button id="btn-invoices">Afficher mes factures</button>
      <pre id="invoices"></pre>
    </div>
    <div class="card" id="admin">
      <h2>Paramètres de la plateforme</h2>
      <button id="btn-settings">Charger les paramètres</button>
      <pre id="settings"></pre>
    </div>
  </main>
  <script src="app.min.js"></script>
</body>
</html>
