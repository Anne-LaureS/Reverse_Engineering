<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intranet RH — Portail</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#f4f6fb;color:#1f2937;margin:0}
    header{background:#1e3a8a;color:#fff;padding:14px 20px;font-weight:600}
    main{max-width:720px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px}
    button{background:#1e3a8a;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
    .muted{color:#6b7280;font-size:.9em}
    #admin{display:none}
    pre{background:#0b1020;color:#edf2fc;padding:12px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <header>Intranet RH — espace employé</header>
  <main>
    <div class="card">
      <h2>Bienvenue</h2>
      <p id="status" class="muted">Chargement du service…</p>
      <button id="btn-profile">Mon profil</button>
    </div>
    <div class="card" id="admin">
      <h2>Panneau d'administration</h2>
      <p class="muted">Réservé aux administrateurs.</p>
      <button id="btn-users">Lister les utilisateurs</button>
      <pre id="users"></pre>
    </div>
  </main>
  <script src="app.min.js"></script>
</body>
</html>
